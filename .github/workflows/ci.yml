name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, json, mbstring, openssl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Audit Composer dependencies
        run: composer audit

      - name: PHP lint
        run: composer lint:php

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: crm_test
          DB_USER: root
          DB_PASS: root
          APP_ENV: testing
        run: php database/migrations/migrate.php

      - name: Run workspace isolation smoke suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: crm_test
          DB_USER: root
          DB_PASS: root
          APP_ENV: testing
        run: composer test:workspace-smoke

      - name: Run Build Week feature suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: crm_test
          DB_USER: root
          DB_PASS: root
          APP_ENV: testing
        run: >-
          vendor/bin/phpunit
          tests/Unit/Config/BasePathResolutionTest.php
          tests/Unit/Core/MigrationStatementNormalizerTest.php
          tests/Unit/Frontend/DashboardAutomationGateTest.php
          tests/Unit/Frontend/FounderCommandCenterHandoffTest.php
          tests/Unit/Frontend/FrontControllerBasePathTest.php
          tests/Unit/Api/MobileDecisionCenterApiContractTest.php
          tests/Unit/Services/AIServiceResponsesTest.php
          tests/Unit/Services/BusinessContextSnapshotServiceTest.php
          tests/Unit/Services/ClarityDeterministicFallbackServiceTest.php
          tests/Unit/Services/ClarityResponsePresentationServiceTest.php
          tests/Unit/Services/FounderCommandCenterAccessServiceTest.php
          tests/Unit/Services/FounderCommandCenterServiceTest.php
          tests/Unit/Services/PresentationFounderWorkspaceServiceTest.php
