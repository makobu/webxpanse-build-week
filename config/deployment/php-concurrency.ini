; Production PHP baseline for concurrent CRM traffic.
; Load this as an additional php.ini fragment and restart PHP-FPM/Apache.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=40000
opcache.validate_timestamps=0
opcache.save_comments=1

realpath_cache_size=4096K
realpath_cache_ttl=600

; Size the process manager separately for available RAM. Do not copy a generic
; pm.max_children value without measuring per-request worker memory.
